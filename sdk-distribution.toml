[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["cargo", "fetch", "--locked", "--manifest-path", "fixtures/windows/Cargo.toml"],
  [
    "make",
    "check-distribution",
    "test-installed-consumers",
    'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"',
  ],
  ["python3", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  [
    "python",
    "-I",
    "-B",
    "{tooling}/tasks/sdk",
    "python",
    "-m",
    "unittest",
    "discover",
    "-s",
    "fixtures/distribution/tests",
  ],
  ["python", "-I", "-B", "{tooling}/tasks/sdk", "windows", "-m", "fixtures.distribution.windows"],
]
