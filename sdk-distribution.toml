[macos]
commands = [
  ["xcrun", "swift", "--version"],
  ["cargo", "fetch", "--locked"],
  ["cargo", "fetch", "--locked", "--manifest-path", "fixtures/windows/Cargo.toml"],
  [
    "make",
    "check-distribution",
    "test-installed-consumers",
    'SDK_TOOLING=python3 -I -B "{tooling}/tasks/sdk"',
  ],
  ["python3", "-I", "-B", "{tooling}/tasks/sdk", "swift-consumer", "--distribution"],
]

[windows]
commands = [
  ["python", "-E", "-S", "-B", "-m", "unittest", "discover", "-s", "tools/tests"],
  ["python", "-I", "-B", "{tooling}/tasks/sdk", "windows", "tools/windows.py"],
]
