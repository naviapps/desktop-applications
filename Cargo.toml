[workspace]
members = ["crates/core", "crates/ffi", "crates/windows", "fixtures/acceptance/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/naviapps/desktop-applications"
rust-version = "1.99"

[workspace.dependencies]
desktop-applications = { path = "crates/core" }
desktop-applications-windows = { path = "crates/windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

strip = "none"
