[swift]
inputs = ["Package.swift", "Sources", "Tests", "Artifacts", "ThirdParty", "LICENSE"]
executable = "DesktopApplicationsConsumer"

[rust_c]
git_url = "https://github.com/naviapps/desktop-applications.git"
rust_packages = ["desktop-applications"]

[rust_c.c]
framework = "Artifacts/CDesktopApplications.xcframework/macos-arm64_x86_64/CDesktopApplications.framework"
header = "desktop_applications.h"

[windows_bindings]
packages = ["desktop-applications-ffi"]
projects = ["bindings/dotnet/tests/DesktopApplications.Tests/DesktopApplications.Tests.csproj"]

[nuget]
package_id = "NaviApps.DesktopApplications"
fixtures = ["fixtures/consumers/dotnet/Program.cs"]
windows_x64 = true
